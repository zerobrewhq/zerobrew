name: parity

on:
  push:
    branches: [ main ]
    paths:
      - 'zb_core/**'
      - 'zb_io/**'
      - 'zb_cli/**'
      - 'Cargo.lock'
      - '.github/workflows/parity.yml'
  pull_request:
    paths:
      - 'zb_core/**'
      - 'zb_io/**'
      - 'zb_cli/**'
      - 'Cargo.lock'
      - '.github/workflows/parity.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: macos-arm64 / rust ${{ matrix.rust }}
    runs-on: macos-latest
    strategy:
      matrix:
        rust: ["1.96"]
    steps:
      - uses: actions/checkout@v4

      - name: install rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-latest-${{ matrix.rust }}

      - name: homebrew version
        run: brew --version

      # One at a time: the tests share the runner's Homebrew, which locks
      # per install.
      - name: run parity tests
        env:
          ZB_PARITY_REQUIRE_BREW: "1"
        run: cargo test --package zb_cli --features parity --test parity -- --nocapture --test-threads=1 --skip install_timings
